[project]
name = "consulta-processos"
version = "0.1.0"
description = "Aplicação para consulta, monitoramento e geração de relatórios de processos judiciais"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "pandas",
    "pydantic",
    "python-dotenv",
    "requests",
    "seleniumbase",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyinstaller",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]