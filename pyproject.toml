[project]
name = "consulta-processos"
version = "0.1.0"
description = "Consulta automatizada de atualizações processuais em bases públicas"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"